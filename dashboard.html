<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard REST API</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#333}
.container{max-width:1000px;margin:0 auto}
h1{color:white;text-align:center;margin-bottom:25px;font-size:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:25px}
.card,.panel{background:white;border-radius:15px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.card{text-align:center}
.panel{margin-bottom:25px}
.panel h2{font-size:18px;margin-bottom:15px;color:#444}
.label{font-size:14px;color:#888;text-transform:uppercase;letter-spacing:1px}
.value{font-size:42px;font-weight:bold;margin:10px 0;color:#667eea}
.unit{font-size:18px;color:#aaa}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px}
.on{background:#d4edda;color:#155724}
.off{background:#f8d7da;color:#721c24}
#alert{display:none;background:#dc3545;color:white;padding:15px;border-radius:10px;margin-bottom:25px;font-weight:600;text-align:center}
.controls{display:flex;gap:15px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 30px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:white}
.btn-on{background:#28a745}.btn-off{background:#dc3545}.btn-set{background:#667eea}
input{padding:11px;border:1px solid #ccc;border-radius:10px;width:100px;font-size:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#f8f9fa;color:#666;text-transform:uppercase;font-size:12px}
#log{background:#1e1e1e;color:#0f0;font-family:monospace;padding:15px;border-radius:10px;max-height:180px;overflow-y:auto;font-size:13px;line-height:1.6}
#log .error{color:#f66}#log .info{color:#6af}
</style>
</head>
<body>
<div class="container">
 <h1>IoT Dashboard REST API</h1>
 <div id="alert"></div>
 <div class="cards">
  <div class="card"><div class="label">Suhu</div><div class="value" id="suhu">--</div><div class="unit">°C</div></div>
  <div class="card"><div class="label">Kelembaban</div><div class="value" id="kelembaban">--</div><div class="unit">%</div></div>
  <div class="card"><div class="label">Status Sensor</div><div class="value" style="font-size:22px"><span class="badge off" id="status">OFFLINE</span></div>
   <div class="label" style="margin-top:8px">Koneksi: <span class="badge off" id="wsbadge">POLLING</span></div></div>
 </div>
 <div class="panel"><h2>Grafik Real-time</h2><canvas id="chart" height="110"></canvas></div>
 <div class="panel"><h2>Kontrol Perangkat</h2>
  <div class="controls">
   <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
   <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
   <span style="margin-left:auto;font-weight:600">Status Lampu: <span class="badge off" id="lamp-status">MATI</span></span>
  </div></div>
 <div class="panel"><h2>Batas Suhu (Threshold)</h2>
  <div class="controls">
   <input type="number" id="max" step="0.1" value="30">
   <button class="btn btn-set" onclick="setThreshold()">Simpan Batas</button>
  </div></div>
 <div class="panel"><h2>10 Data Sensor Terakhir</h2>
  <table><thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
  <tbody id="history-body"><tr><td colspan="3" style="text-align:center;color:#999">Loading...</td></tr></tbody></table></div>
 <div class="panel"><h2>Log Aktivitas</h2><div id="log"></div></div>
</div>
<script>
const HOST = 'localhost:1880';
const API = `http://${HOST}/api`;
const WS_URL = `ws://${HOST}/ws/sensor`;
const API_KEY = 'iot-kampus-123';
const $ = id => document.getElementById(id);

let rows = [], lastRecv = null, lastSeen = 0, wsOk = false;

function log(msg, type = 'info') {
  const el = $('log');
  el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function api(path, opt = {}) {
  const res = await fetch(API + path, {
    ...opt,
    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY }
  });
  return res.json();
}

const chart = new Chart($('chart'), {
  type: 'line',
  data: { labels: [], datasets: [
    { label: 'Suhu (°C)', data: [], borderColor: '#e74c3c', tension: 0.3 },
    { label: 'Kelembaban (%)', data: [], borderColor: '#3498db', tension: 0.3 }
  ]},
  options: { animation: false }
});

function pushChart(d) {
  const t = new Date(d.received).toLocaleTimeString();
  chart.data.labels.push(t);
  chart.data.datasets[0].data.push(d.suhu);
  chart.data.datasets[1].data.push(d.kelembaban);
  if (chart.data.labels.length > 30) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(s => s.data.shift());
  }
  chart.update();
}

function renderTable() {
  if (!rows.length) return;
  $('history-body').innerHTML = rows.slice(-10).reverse().map(d => `
    <tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`).join('');
}

function update(d) {
  if (!d || d.suhu === null || d.received === lastRecv) return;
  lastRecv = d.received;
  lastSeen = Date.now();
  $('suhu').textContent = d.suhu;
  $('kelembaban').textContent = d.kelembaban;
  $('status').textContent = 'ONLINE';
  $('status').className = 'badge on';
  const al = $('alert');
  al.style.display = d.alert ? 'block' : 'none';
  if (d.alert) {
    al.textContent = `PERINGATAN: suhu ${d.suhu}°C melewati batas ${d.max}°C`;
    log(`Suhu ${d.suhu} melewati batas ${d.max}`, 'error');
  }
  rows.push(d);
  if (rows.length > 50) rows.shift();
  pushChart(d);
  renderTable();
}

async function loadHistory() {
  try {
    const j = await api('/history');
    if (j.status !== 'success') return log(`Gagal history: ${j.message}`, 'error');
    rows = j.data;
    chart.data.labels = []; chart.data.datasets.forEach(s => s.data = []);
    rows.slice(-30).forEach(pushChart);
    renderTable();
    if (rows.length) lastRecv = rows[rows.length - 1].received;
  } catch (err) { log(`Gagal fetch history: ${err.message}`, 'error'); }
}

async function loadThreshold() {
  try {
    const j = await api('/threshold');
    if (j.status === 'success') $('max').value = j.threshold.max;
  } catch (err) { log(`Gagal fetch threshold: ${err.message}`, 'error'); }
}

async function setThreshold() {
  try {
    const j = await api('/threshold', { method: 'PUT', body: JSON.stringify({ max: $('max').value }) });
    if (j.status === 'success') log(`Batas suhu diubah ke ${j.threshold.max}°C`);
    else log(`Gagal: ${j.message}`, 'error');
  } catch (err) { log(`Error threshold: ${err.message}`, 'error'); }
}

async function kontrol(device, action) {
  try {
    const j = await api('/kontrol', { method: 'POST', body: JSON.stringify({ device, action }) });
    if (j.status === 'success') {
      log(`Perintah terkirim: ${device} ${action}`);
      if (device === 'lamp') {
        const isOn = action === 'on';
        $('lamp-status').textContent = isOn ? 'MENYALA' : 'MATI';
        $('lamp-status').className = `badge ${isOn ? 'on' : 'off'}`;
      }
    } else log(`Gagal: ${j.message}`, 'error');
  } catch (err) { log(`Error kontrol: ${err.message}`, 'error'); }
}

function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    wsOk = true;
    $('wsbadge').textContent = 'WEBSOCKET'; $('wsbadge').className = 'badge on';
    log('WebSocket terhubung');
  };
  ws.onmessage = e => update(JSON.parse(e.data));
  ws.onclose = () => {
    wsOk = false;
    $('wsbadge').textContent = 'POLLING'; $('wsbadge').className = 'badge off';
    setTimeout(connectWS, 3000);
  };
}

setInterval(async () => {
  if (wsOk) return;
  try { update((await api('/suhu')).data); }
  catch (err) { log(`Gagal fetch sensor: ${err.message}`, 'error'); }
}, 3000);

setInterval(() => {
  if (lastSeen && Date.now() - lastSeen > 10000) {
    $('status').textContent = 'OFFLINE'; $('status').className = 'badge off';
  }
}, 2000);

log('Dashboard dimulai');
loadThreshold();
loadHistory().then(connectWS);
</script>
</body>
</html>
